<!doctype html>
<html lang="en" class="relative overflow-x-hidden">
	<head>
		<meta charset="utf-8" />
		<script>
			// Set the color theme before first paint to avoid a flash of the wrong mode.
			(function () {
				try {
					var stored = localStorage.getItem('theme');
					var dark = stored
						? stored === 'dark'
						: window.matchMedia('(prefers-color-scheme: dark)').matches;
					if (dark) document.documentElement.classList.add('dark');
				} catch (e) {}
				// Few cores, little memory or Save-Data: Background3D, Character3D and app.css draw less.
				var n = navigator;
				if (
					(n.hardwareConcurrency || 8) <= 4 ||
					(n.deviceMemory || 8) <= 2 ||
					(n.connection && n.connection.saveData)
				)
					document.documentElement.dataset.lite = '';
			})();
		</script>
		<link rel="icon" href="%sveltekit.assets%/Logo.webp" />
		<link rel="shortcut icon" href="%sveltekit.assets%/Logo.webp" />
		<!-- Icons only: don't hold the first paint for a third-party stylesheet. -->
		<link
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
			rel="stylesheet"
			media="print"
			onload="this.media = 'all'"
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Bangers&family=Fira+Code:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Titles, descriptions, canonical and og/twitter tags are per page, in each <svelte:head>. -->
		%sveltekit.head%
		<title>arpthef</title>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
